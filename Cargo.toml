[package]
name = "lamarge"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
authors = ["Snowbl Capital"]
description = "Client for the LaMarge API: sign-in, takes, transfers, withdrawals and market making, each request checked before it is signed."
repository = "https://github.com/snowbl-capital/lamarge-sdk-rs"
homepage = "https://docs.lamarge.trade/rust-sdk"
documentation = "https://docs.rs/lamarge"
readme = "README.md"
keywords = ["lamarge", "ethereum", "eip712", "trading", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies", "asynchronous"]
include = ["src/**/*.rs", "examples/**", "tests/live.rs", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["rustls/aws_lc_rs"]
ring = ["rustls/ring"]

[dependencies]
alloy-primitives = { version = "1.7.3", default-features = false, features = ["std", "serde", "k256"] }
alloy-sol-types = { version = "1.7.3", default-features = false, features = ["std", "eip712-serde"] }
alloy-dyn-abi = { version = "1.7.3", default-features = false, features = ["std", "eip712"] }
alloy-signer = { version = "2.5.0", default-features = false, features = ["eip712"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
fastrand = "2.5.0"
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["query", "http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.29.2", default-features = false, features = ["std", "serde", "v7"] }

[dev-dependencies]
alloy-signer-local = { version = "2.5.0", features = ["eip712"] }
proptest = "1.12.0"
serde-saphyr = "2.1.1"
serde_ignored = "0.1.14"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
wiremock = "0.6.5"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
dbg_macro = "deny"
large_futures = "warn"
result_large_err = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
